<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/navbar.html :: header( title = 'Productos')}"></head>

<body class="container mt-4">
<div th:replace="~{fragments/navbar.html :: navbar('productos')}"></div>
<div th:if="${msg != null}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
    <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${msg}"></span>
</div>
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Lista Productos</h1>
    <a th:href="@{/crearProducto}" class="btn btn-primary">Registrar Nuevo producto</a>
</div>
<table class="table table-striped table-bordered">
    <tr>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
    </tr>
    <tbody>
    <tr th:each="producto : ${listaProductos}">
        <td th:text="${producto.nombre}"></td>
        <td th:text="${producto.precio}"></td>
        <td th:text="${producto.stock}"></td>
        <td>
            <a th:href="@{/editarProducto(id=${producto.id})}" class="btn btn-primary">Editar</a>
        </td>
        <td>
            <a th:href="@{/eliminarProducto(id=${producto.id})}" class="btn btn-warning">Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>

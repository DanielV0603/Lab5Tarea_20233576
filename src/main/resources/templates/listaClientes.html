<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/navbar.html :: header( title = 'Clientes')}"></head>

<body class="container mt-4">
    <div th:replace="~{fragments/navbar.html :: navbar('clientes')}"></div>
        <div th:if="${msg != null}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${msg}"></span>
        </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Lista Clientes</h1>
        <a th:href="@{/crearCliente}" class="btn btn-primary">Registrar Nuevo cliente</a>
    </div>
    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Documento</th>
            <th>Tipo de documento</th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${listaClientes}">
            <td th:text="${cliente.nombre}"></td>
            <td th:text="${cliente.documento}"></td>
            <td th:text="${cliente.documentoTipo}"></td>
            <td>
                <a th:href="@{/editarCliente(id=${cliente.id})}" class="btn btn-primary">Editar</a>
            </td>
            <td>
                <a th:href="@{/eliminarCliente(id=${cliente.id})}" class="btn btn-warning">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>

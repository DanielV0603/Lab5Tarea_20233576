<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/navbar.html :: header(title='Comprobantes')}"></head>

<body class="container mt-4">
<div th:replace="~{fragments/navbar.html :: navbar('comprobantes')}"></div>
    <div th:if="${msg != null}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${msg}"></span>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Lista de Comprobantes</h1>
        <a th:href="@{/comprobantes/nuevo}" class="btn btn-primary">Nuevo Comprobante</a>
    </div>
    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Total (S/)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="comprobante : ${listaComprobantes}">
            <td th:text="${comprobante.id}"></td>
            <td th:text="${comprobante.type}"></td>
            <td th:text="${comprobante.date}"></td>
            <td th:text="${comprobante.customerName}"></td>
            <td th:text="${#numbers.formatDecimal(comprobante.total, 1, 2)}"></td>
        </tr>
        </tbody>
    </table>
</body>
</html>
